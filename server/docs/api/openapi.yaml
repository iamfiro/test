openapi: 3.1.0
info:
  title: StudyVillage API
  version: 0.5.7
  description: |
    StudyVillage HTTP 계약의 원천. 응답은 PocketTime과 같은 봉투 `{data, error, meta}`를 쓴다.
    인증은 API 호스트 전용 세션 쿠키(`sv_session`, HttpOnly·Secure·SameSite=Lax)다. 상태를 바꾸는
    요청(POST·PUT·PATCH·DELETE)은 `X-CSRF-Token` 헤더에 세션의 CSRF 토큰을 실어야 한다(로그인
    요청 제외). 쓰기 요청은 `Idempotency-Key`가 필수인 경우 명시한다. 같은 키 재전송은 처음 응답을
    그대로 돌려주고, 같은 키에 다른 본문이면 `409 IDEMPOTENCY_KEY_REUSED`다.
servers:
  - url: http://localhost:5191
    description: 로컬 개발
  - url: https://village-api.pocket-time.study
    description: 운영(미배포)
security:
  - session: []
tags:
  - name: ops
  - name: auth
  - name: profile
  - name: timer
  - name: rooms
  - name: tags
  - name: moderation
  - name: league
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealth
      summary: 가동 확인(DB 연결 포함)
      security: []
      responses:
        '200':
          description: 살아 있고 DB에 닿는다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [status]
                    properties:
                      status: { type: string, enum: [ok] }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: 지금 세션의 사용자와 CSRF 토큰
      description: 쿠키가 없거나 만료·폐기됐으면 401. 성공하면 세션 마지막 사용 시각을 갱신해 만료를 180일 뒤로 민다.
      responses:
        '200':
          description: 로그인 상태
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/start:
    post:
      tags: [auth]
      operationId: startAnonymousSession
      summary: 익명 계정으로 시작하기(데모)
      security: []
      description: |
        로그인 없이 쓰는 데모의 진입점. 유효한 세션 쿠키가 있으면 그 계정을 그대로 돌려주고, 없으면 익명 계정과
        세션을 만들어 `sv_session` 쿠키를 둔다. 닉네임·캐릭터는 무작위로 정한다. CSRF 토큰은 필요 없다
        (세션이 없을 수 있다). 같은 `Idempotency-Key`를 다시 보내면 같은 계정에 새 세션을 발급한다(쿠키를 못
        받은 응답의 재시도). IP당 시간당 새 계정 수에 상한이 있다.
        운영자가 새 계정 생성을 끄면(긴급 스위치) 503 `ACCOUNT_CREATE_DISABLED`, 이 IP의 계정 생성을 정지했으면
        403 `ACCOUNT_CREATE_RESTRICTED`다. 둘 다 새 계정을 만들 때만이고, 세션이 이미 있는 사람과 이미 만든 계정의
        재시도(같은 키)는 그대로 200이다.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/LoggedIn' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '403': { $ref: '#/components/responses/AccountCreateRestricted' }
        '429': { $ref: '#/components/responses/AccountRateLimited' }
        '503': { $ref: '#/components/responses/AccountCreateDisabled' }
  /auth/nonce:
    get:
      tags: [auth]
      operationId: getLoginNonce
      summary: Google·Apple ID 토큰에 넣을 1회용 nonce
      security: []
      description: nonce를 돌려주고 같은 값을 5분짜리 HttpOnly 쿠키 `sv_nonce`에도 둔다. 로그인 때 ID 토큰의 nonce가 쿠키 값과 같아야 한다.
      responses:
        '200':
          description: nonce
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [nonce]
                    properties:
                      nonce: { type: string }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
  /auth/login/{provider}:
    post:
      tags: [auth]
      operationId: loginWithIdToken
      summary: Google·Apple ID 토큰으로 로그인
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, apple] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/LoggedIn' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/kakao/start:
    get:
      tags: [auth]
      operationId: startKakaoLogin
      summary: 카카오 로그인 시작(브라우저 이동)
      security: []
      parameters:
        - name: return_to
          in: query
          required: true
          description: 로그인 뒤 돌아갈 웹 경로. `/`로 시작하는 같은 사이트 경로만 받는다.
          schema: { type: string, pattern: '^/' }
      responses:
        '302': { description: 카카오 인가 화면으로 이동. state를 HttpOnly 쿠키에 둔다 }
  /auth/kakao/callback:
    get:
      tags: [auth]
      operationId: finishKakaoLogin
      summary: 카카오 인가 코드 교환(브라우저 이동)
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: |
            성공하면 세션 쿠키를 두고 `return_to`로, 실패하면 웹 `/login?error=kakao`로 이동한다.
  /auth/login/dev:
    post:
      tags: [auth]
      operationId: loginForDevelopment
      summary: 개발 전용 로그인
      security: []
      description: 서버 설정 `DEV_LOGIN_ENABLED=true`일 때만 있다. 꺼져 있으면 404. 운영 설정에서는 서버가 이 값으로 시작하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject:
                  type: string
                  pattern: '^[a-z0-9_-]{1,32}$'
                  description: 같은 subject는 같은 개발 계정이다.
      responses:
        '200': { $ref: '#/components/responses/LoggedIn' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 이 세션 로그아웃
      description: 세션을 지우고 쿠키를 만료시킨다. 이미 없는 세션이어도 204.
      responses:
        '204': { description: 로그아웃됨 }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: 모든 기기·탭 로그아웃
      responses:
        '204': { description: 이 사용자의 모든 세션을 지움 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /users/me:
    delete:
      tags: [auth]
      operationId: deleteMyAccount
      summary: 탈퇴(즉시 삭제)
      description: 유예 없이 이 사용자의 데이터 전부를 지우고 모든 세션을 끊는다. 되돌릴 수 없다.
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /users/me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: 다른 사람에게 보이는 내 프로필
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [profile]
      operationId: updateMyProfile
      summary: 닉네임·캐릭터·성별 바꾸기
      description: |
        보낸 항목만 바꾼다. 하나도 없거나 규칙에 맞지 않으면 422(`error.details.field`). 닉네임에 금칙어가 들어 있어도
        422 `VALIDATION_ERROR`(`field: nickname`)이고, 메시지는 어떤 말이 걸렸는지 밝히지 않는다.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ProfileOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/onboarding:
    put:
      tags: [profile]
      operationId: completeOnboarding
      summary: 첫 가입 온보딩을 끝냈다고 남긴다
      description: |
        끝까지 보거나 건너뛰었을 때 부른다. 이미 남겼으면 처음 시각을 그대로 둔다(덮어쓰지 않는다).
        응답은 바뀐 `Me`.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/MeOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /users/me/study-settings:
    get:
      tags: [timer]
      operationId: getStudySettings
      summary: 하루 목표·과목 목록·고른 과목
      responses:
        '200': { $ref: '#/components/responses/StudySettingsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [timer]
      operationId: putStudySettings
      summary: 설정 전체를 바꾼다
      description: |
        과목 이름은 앞뒤 공백을 지운 뒤 1–20자, 서로 달라야 한다. `subject`는 `subjects`에 있는 이름이거나
        null. `subject_colors`의 값은 0–7(앱 StudySubjectPalette 순서). 목록에 없는 과목의 색은 지운다.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudySettings' }
      responses:
        '200': { $ref: '#/components/responses/StudySettingsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study/active-session:
    get:
      tags: [timer]
      operationId: getActiveSession
      summary: 계정의 진행 중 세션(없으면 null)
      description: 계정당 하나다. 모든 탭·기기가 같은 세션을 본다. 시각은 서버 시각이고 `meta.timestamp`와 비교해 흐른 시간을 그린다.
      responses:
        '200': { $ref: '#/components/responses/ActiveSessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /study/active-session/start:
    post:
      tags: [timer]
      operationId: startStudySession
      summary: 공부 시작
      description: |
        진행 중 세션이 이미 있으면 새로 만들지 않고 그 세션을 200으로 돌려준다(다른 탭·기기에서 이미 켠
        경우). 새로 만들면 201. 시작 시각은 서버 시각이다. `timezone`은 이 세션의 공부일(04:00 경계)을
        정하는 IANA 이름.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, timezone]
              properties:
                subject:
                  description: 설정의 과목 이름 또는 null(과목 없음).
                  type: [string, 'null']
                timezone: { type: string, examples: [Asia/Seoul] }
      responses:
        '200': { $ref: '#/components/responses/ActiveSessionOk' }
        '201': { $ref: '#/components/responses/ActiveSessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study/active-session/{session_id}/pause:
    post:
      tags: [timer]
      operationId: pauseStudySession
      summary: 일시정지(열린 구간을 서버 시각으로 닫음)
      description: 이미 일시정지면 그대로 200. 진행 중 세션이 이 id가 아니면 409 `SESSION_NOT_ACTIVE`.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/ActiveSessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
  /study/active-session/{session_id}/resume:
    post:
      tags: [timer]
      operationId: resumeStudySession
      summary: 다시 시작(새 구간을 서버 시각으로 엶)
      description: 이미 진행 중이면 그대로 200. 진행 중 세션이 이 id가 아니면 409 `SESSION_NOT_ACTIVE`.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/ActiveSessionOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
  /study/active-session/{session_id}/finish:
    post:
      tags: [timer]
      operationId: finishStudySession
      summary: 끝내기(기록으로 확정)
      description: |
        열린 구간을 서버 시각으로 닫고 기록을 만든다. 공부한 시간이 0초면 기록 없이 지우고 `record`가 null
        (앱 규칙). 같은 세션을 다시 끝내면(응답 유실 재시도) 같은 결과. 진행 중 세션이 이 id가 아니고 기록도
        없으면 409 `SESSION_NOT_ACTIVE`.
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 끝냄
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [record]
                    properties:
                      record:
                        oneOf:
                          - { $ref: '#/components/schemas/StudyRecord' }
                          - { type: 'null' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
  /study/presence:
    put:
      tags: [timer]
      operationId: putStudyPresence
      summary: 화면이 열려 있다는 신호(30초마다)
      description: |
        진행 중 세션이 있는 동안 웹 탭이 보일 때 30초마다 보낸다. 서버는 **받은 서버 시각**으로 관측 구간을
        만든다(75초 넘게 끊기면 구간을 닫고 앞뒤 45초 여유, PocketTime 랭킹과 같은 규칙). 랭킹에는 이 관측
        구간과 겹친 공부 시간만 들어간다. 진행 중 세션이 이 id가 아니면 409. 같은 계정의 여러 탭이 보내도 한
        구간으로 합친다. 멱등이라 Idempotency-Key가 필요 없다. 시작·재개·일시정지·끝내기 요청을 받은 시각도
        같은 관측으로 친다(시작·재개는 끊긴 구간을 새로 열 수 있고, 일시정지 중 신호와 일시정지·끝내기는 이어
        주기만 한다). 인정 시간은 지금을 넘지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '204': { description: 받음 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
  /study/stats:
    get:
      tags: [timer]
      operationId: getStudyStats
      summary: 통계(오늘·어제·이번 주·연속일·과목·최근 16주)
      description: |
        서버가 끝낸 기록으로 계산한다(진행 중 세션은 넣지 않는다. 화면은 진행 중 세션의 흐른 시간을 앱
        `study_stats.dart` 규칙(기기 시간대 04:00 경계로 나눔)대로 더해 그린다). 공부일은 시간대의 04:00 경계,
        주는 월요일부터, 연속일은 하루 10분 이상인 날(오늘이 10분 미만이면 어제부터 센다), 과목 비중은 이번
        주 1분 이상만. 모두 PocketTime `study_stats.dart` 규칙과 같다. 단 연속일만은 기록 시간이 아니라 서버가
        presence로 **인정한 공부 시간**(끝낸 세션의 인정 구간)으로 센다(study-league.md L2, PocketTime과 다른 점).
      parameters:
        - name: timezone
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/StudyStats' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study/league:
    get:
      tags: [league]
      operationId: getStudyLeague
      summary: 이번 주 리그와 내 그룹 순위표
      description: |
        내 리그, 이번 리그 주(`Asia/Seoul` 월요일 04:00 ~ 다음 월요일 04:00)의 시작·마감, 내 그룹 순위표를 서버가
        계산해 내려준다. 순위·구역(승급·강등)·내 순위·위 순위까지 남은 초는 모두 서버 판정이고 화면은 다시 계산하지
        않는다. 점수는 서버가 presence로 인정한 공부 시간(초)만이고, 인정 구간의 절대 시각이 주 안에 든 부분만 센다
        (주 경계를 걸친 구간은 경계에서 자른다). 그 주에 인정 시간이 처음 생기는 순간 그 리그의 열린 그룹(30명 미만 중
        가장 먼저 만든 것)에 들어가고, 아직 없으면 `group`은 null이다. 같은 점수면 그 점수에 먼저 닿은 사람이 위다.
        주 마감 뒤 그 주 정산이 끝나기 전에는(마감 + `LEAGUE_SETTLE_DELAY`, 기본 10분) **지난 주**를 `status:
        settling`으로 보여 주고 화면은 "집계 중"으로 보인다. 정산이 끝나면 새 주(`open`)를 보여 준다. 탈퇴한 사람은
        순위표에서 빠지고 아래 순위가 당겨지지만 `size`는 줄지 않는다. `ETag`를 주고 `If-None-Match`면 304.
      responses:
        '200':
          description: 리그 현황
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/LeagueStanding' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '304': { description: 바뀐 것 없음 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /study/streak:
    get:
      tags: [league]
      operationId: getStudyStreak
      summary: 연속 공부일(스트릭)
      description: |
        서버가 presence로 인정한 공부 시간 기준 연속일이다(기록 시간이 아니다, study-league.md L2). 하루 인정 시간이
        10분 이상이면 그날을 공부한 날로 친다. 인정 구간의 공부일은 그 세션을 시작할 때의 시간대 04:00 경계로 정해져
        있고(`ranked_segments.study_date`), "오늘"은 `timezone`의 04:00 경계로 정한다. 진행 중 세션도 서버가 마지막으로
        본 때까지의 인정 시간이 들어간다. 현재 스트릭은 오늘(오늘이 아직 10분 미만이면 어제)까지 빠짐없이 이어진 날
        수, `longest`는 지금까지 가장 길었던 연속일이다. 스트릭 보호는 없다(하루라도 놓치면 0). `recent_days`는 오늘을
        포함한 최근 7일, 오래된 날부터. `ETag`를 주고 `If-None-Match`면 304.
      parameters:
        - name: timezone
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 스트릭
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/StudyStreak' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '304': { description: 바뀐 것 없음 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study/league/results/latest:
    get:
      tags: [league]
      operationId: getLatestLeagueResult
      summary: 아직 안 본 최근 정산 결과
      description: |
        내 가장 최근 리그 정산 결과가 아직 본 것으로 기록되지 않았으면 그것을, 봤거나 결과가 없으면 204. 결과는 주
        정산(마감 + `LEAGUE_SETTLE_DELAY`) 때 그 주 그룹에 있던 사람에게, 그리고 그 주 공부하지 않아 그룹에 없던
        카페인 리그(`top`) 소속에게(강등) 생긴다. 더 오래된 안 본 결과는 보여 주지 않는다. 보상(도토리)은 없다
        (launch.md M1, 상점과 함께 붙인다).
      responses:
        '200':
          description: 안 본 결과
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/LeagueResult' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '204': { description: 볼 결과 없음 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /study/league/results/{week_start}/seen:
    parameters:
      - name: week_start
        in: path
        required: true
        description: 결과의 `week_start` 값 그대로(ISO 시각).
        schema: { type: string, format: date-time }
    post:
      tags: [league]
      operationId: markLeagueResultSeen
      summary: 정산 결과를 봤다고 기록
      description: |
        결과 시트를 닫을 때 부른다. 이미 봤어도(재시도·다른 탭) 204. 내 결과가 없는 주면 404, 시각 형식이 아니면 422
        `field: week_start`.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: 기록했다 }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study/records:
    get:
      tags: [timer]
      operationId: listStudyRecords
      summary: 기간의 기록(플래너 격자용)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 포함. 최대 62일, schema: { type: string, format: date } }
      responses:
        '200':
          description: 기록(시작 순)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/StudyRecord' } }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports:
    post:
      tags: [moderation]
      operationId: createReport
      summary: 신고하기(닉네임·방 이름·채팅 메시지)
      description: |
        다른 사람의 닉네임을 신고한다. `target_id`는 그 사람의 사용자 id다. 한 사람은 같은 사람의 같은 닉네임을
        한 번만 신고한다: 다시 보내면(다른 키여도) 처음 신고를 그대로 200으로 돌려주고 더 세지 않는다. 서로 다른
        사람의 신고가 기준(`REPORT_HIDE_THRESHOLD`, 기본 3)에 닿으면 서버가 그 닉네임을 무작위 닉네임으로 바로
        되돌린다(신고자에게 결과를 알리지 않는다). 내 닉네임은 신고할 수 없다(422, `field: target_id`).
        방 이름도 신고할 수 있다(`target_type: room_name`, `target_id`는 방 id, 주인은 방장). 같은 이름에 대한 서로 다른
        사람의 신고가 기준에 닿으면 서버가 방 이름을 앱 기본 이름(`<방장 닉네임>의 공부방`)으로 바로 바꾼다. 내 방 이름은
        신고할 수 없다(422).
        채팅 메시지도 신고할 수 있다(`target_type: message`, `target_id`는 메시지 `id`, 주인은 작성자). 신고자가 지금 볼 수
        있는 메시지만 받는다(로비, 또는 지금 멤버인 방의 메시지. 숨겼거나 30일 지났으면 404). 같은 메시지에 대한 서로 다른
        사람의 신고가 기준에 닿으면 서버가 바로 모두에게서 숨기고 그 토픽에 `message_hidden`을 보낸다
        (`docs/contracts/study-room-chat.md`). 내 메시지는 신고할 수 없다(422).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '200': { $ref: '#/components/responses/ReportOk' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/blocks:
    get:
      tags: [moderation]
      operationId: listChatBlocks
      summary: 내 채팅 차단 목록
      description: |
        내가 차단한 사람(최근 차단 먼저, 최대 500명). 닉네임·캐릭터는 지금 값이다(해제 화면). 차단은 내 화면에서만
        숨긴다(결정 9): 그 사람의 채팅 메시지를 서버가 나에게 보내지 않고(`joined`·`message`), 방 실시간 명단에서는 빼지 않는다.
        상대는 차단당한 것을 모른다.
      responses:
        '200': { $ref: '#/components/responses/BlocksOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/blocks/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: 차단할 사람의 사용자 id(채팅 `author.id`, 방 명단 `user_id`).
        schema: { type: string, format: uuid }
    put:
      tags: [moderation]
      operationId: blockChatUser
      summary: 채팅 차단
      description: |
        이미 차단했으면 그대로 200(처음 차단 시각). 나는 차단할 수 없다(422 `field: user_id`), 없는 사용자는 404,
        500명을 넘으면 422. 열려 있는 내 소켓에도 바로 적용된다(그 뒤로 오는 메시지부터).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/BlockOk' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [moderation]
      operationId: unblockChatUser
      summary: 채팅 차단 해제
      description: 차단하지 않았던 사람이어도(재시도) 204.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: 해제했다 }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /study-rooms:
    get:
      tags: [rooms]
      operationId: listStudyRooms
      summary: 공부방 목록(최신 100개)
      description: |
        `mine`은 내가 멤버인 방(비밀번호 방 포함), `all`은 모든 방. `recommended`는 방 태그가 내 태그와 하나라도
        겹치는 방이다(비밀번호 방·꽉 찬 방 포함, 내 태그가 없으면 빈 목록). `recommended`의 순서는 겹친 태그 수
        많은 순 → `studying_count` 많은 순 → 최신 순이고, 다른 scope는 최신 순이다. `q`가 있으면 서버가 방 이름에
        그 글자가 들어간 방만 돌려준다(대소문자 무시, 앞뒤 공백 제거, 1–40자. 공백뿐이면 422 `q`). 비밀번호는 목록에 싣지 않는다.
        `studying_count`는 서버가 presence로 본 "지금 공부 중"인 멤버 수다.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [mine, all, recommended] }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: 방 목록(순서는 위 설명)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [rooms]
                    properties:
                      rooms: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Room' } }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [rooms]
      operationId: createStudyRoom
      summary: 공부방 만들기
      description: |
        만든 사람이 방장 겸 첫 멤버가 된다. 한 사람은 방 하나에만 속하므로 이미 다른 방의
        멤버면 `409 STUDY_ROOM_ALREADY_MEMBER`다(화면은 앱처럼 "공부방은 하나만" 안내를 띄운다). 안 산 유료 맵이면
        `403 STUDY_ROOM_MAP_NOT_OWNED`(지금은 `cafe` 말고는 모두 거절, 유료 맵 도입 전). `capacity`는 2 이상, 맵 자리 수
        (33)와 50 중 작은 값 이하(벗어나면 422 `capacity`). 배너·로고는 방이 생긴 뒤 `PUT /study-rooms/{id}/images/{slot}`로 올린다.
        응답은 방장이 받는 상세(`password` 포함)다.

        이름·소개에 금칙어(닉네임과 같은 서버 목록)가 있으면 422(`field: name`·`description`, 무엇이 걸렸는지는 말하지 않는다).
        운영자가 방 만들기를 잠시 끄면 503 `ROOM_CREATE_DISABLED`, 이 계정이나 IP의 방 만들기를 정지했으면
        403 `ROOM_CREATE_RESTRICTED`, 같은 IP에서 하루(24시간)에 만든 방이 상한(`ROOM_CREATE_PER_IP_PER_DAY`, 기본 10)에
        닿으면 429 `ROOM_CREATE_RATE_LIMITED`(`Retry-After`)다. 이 세 가지는 만들기에만 적용한다(수정·참여는 막지 않는다).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomCreate' }
      responses:
        '201': { $ref: '#/components/responses/RoomDetailOk' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '409': { $ref: '#/components/responses/RoomConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RoomCreateRateLimited' }
        '503': { $ref: '#/components/responses/RoomCreateDisabled' }
  /study-rooms/{room_id}:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
    get:
      tags: [rooms]
      operationId: getStudyRoom
      summary: 공부방 상세
      description: |
        멤버는 `members`(전체 명단)를 받고, 멤버가 아니면 `members`가 null이다(미리보기).
        `password`는 비밀번호 방의 방장에게만 오고, 그 밖에는 null이다. 없는 방이면 404.
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rooms]
      operationId: updateStudyRoom
      summary: 공부방 수정(방장만)
      description: |
        보낸 키만 바꾼다. `description`이 null이거나 공백뿐이면 지운다. `password`는 문자열이면
        설정·변경, null이면 지운다(기존 멤버는 그대로). `capacity`는 지금 멤버 수보다 작게 줄일 수 없다
        (`409 STUDY_ROOM_CAPACITY_BELOW_MEMBERS`). 방장이 아니면 `403 STUDY_ROOM_HOST_ONLY`. 이름·소개의 금칙어 규칙은
        만들기와 같다. 응답은 방장 상세.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomUpdate' }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [rooms]
      operationId: deleteStudyRoom
      summary: 공부방 삭제(방장만)
      description: 모든 멤버십·초대·올린 사진을 함께 지운다. 이미 없는 방이면(재시도) 204.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: 지웠다 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
  /study-rooms/{room_id}/join:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
    post:
      tags: [rooms]
      operationId: joinStudyRoom
      summary: 공부방 참여
      description: |
        비밀번호 방은 `password`(대소문자 구분)가 맞아야 한다(`403 STUDY_ROOM_WRONG_PASSWORD`).
        이미 이 방 멤버면 비밀번호 없이 성공한다(멱등). 정원이 차면 `409 STUDY_ROOM_FULL`. 다른 방 멤버인데
        `leave_current_room`이 true가 아니면 `409 STUDY_ROOM_ALREADY_MEMBER`다. true면 서버가 비밀번호·정원을 먼저
        확인한 뒤 한 트랜잭션에서 지금 방을 나가고(내가 방장이면 그 방은 삭제) 이 방에 들어간다. 그래서 비밀번호가
        틀리거나 정원이 차 있으면 지금 방은 그대로다. 참여·초대 수락을 합쳐 사용자당 시간당 30회(`429`).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { type: string, minLength: 4, maxLength: 20 }
                leave_current_room: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /study-rooms/{room_id}/leave:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
    post:
      tags: [rooms]
      operationId: leaveStudyRoom
      summary: 공부방 나가기
      description: 방장이 나가면 방이 삭제된다(삭제와 같은 정리). 이미 멤버가 아니면(재시도) 204.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: 나갔다 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /study-rooms/{room_id}/members/{user_id}:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [rooms]
      operationId: removeStudyRoomMember
      summary: 멤버 내보내기(방장만)
      description: 차단이 아니다(다시 참여할 수 있다). 방장 자신은 내보낼 수 없다(422). 이미 멤버가 아니면(재시도) 그대로 성공한다. 응답은 바뀐 방장 상세.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study-rooms/{room_id}/seat:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
    put:
      tags: [rooms]
      operationId: moveStudyRoomSeat
      summary: 내 자리 옮기기
      description: |
        3D 방의 자리 번호(0–32, 웹 `room3d/scenes.ts` `cafeSeats` 순서)를 바꾼다. 들어올 때 서버가 비어 있는 가장 작은
        번호를 준다(방장은 0). 같은 자리면 그대로 200, 다른 사람이 앉은 자리면 409 `STUDY_ROOM_SEAT_TAKEN`, 멤버가
        아니면 403 `STUDY_ROOM_NOT_MEMBER`, 범위 밖이면 422 `field: seat`. 바뀌면 방 실시간 채널에 `member_updated`
        (docs/contracts/study-room-live.md)가 간다.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seat]
              properties:
                seat: { type: integer, minimum: 0, maximum: 32 }
      responses:
        '200': { $ref: '#/components/responses/SeatOk' }
        '400': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /study-rooms/{room_id}/images/{slot}:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
      - name: slot
        in: path
        required: true
        schema: { type: string, enum: [banner, logo] }
    put:
      tags: [rooms]
      operationId: putStudyRoomImage
      summary: 배너·로고 올리기(방장만)
      description: |
        JPEG·PNG·WebP, 10MB 이하(PocketTime 업로드 규칙과 같다). 서버는 보낸 형식을 믿지 않고 파일 앞부분(매직 바이트)과
        이미지 머리(가로·세로)를 읽어 다시 확인한다(아니면 422 `file`). 요청 전체가 11MB를 넘으면 413. 파일은 미디어 저장소
        (운영 R2 `media.pocket-time.study`)에 `rooms/<room_id>/<slot>/<id>` 키로 두고, 바꾸면 새 id·URL이 생기고 이전 파일은
        지운다. 방을 지우거나 방장이 계정을 지우면 파일도 지운다. 응답은 방장 상세.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [rooms]
      operationId: deleteStudyRoomImage
      summary: 배너·로고 지우기(방장만)
      description: 이미 없으면 그대로 성공. 응답은 방장 상세.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /study-rooms/{room_id}/invite:
    parameters:
      - { $ref: '#/components/parameters/RoomId' }
    post:
      tags: [rooms]
      operationId: issueStudyRoomInvite
      summary: 초대 링크 발급(방장만)
      description: |
        7일 동안 쓰는 링크 `https://<웹>/r#<token>`을 새로 만든다(`<웹>`은 서버 설정 `INVITE_WEB_ORIGIN`). 새로 만들면 이전 링크는 무효다.
        토큰은 조각(`#`) 뒤에만 있어 웹 서버·API 접근 로그에 닿지 않는다. 서버는 토큰의 SHA-256 다이제스트만 저장하고
        토큰을 로그에 남기지 않는다. 발급은 멱등 영수증을 쓰지 않는다(재시도하면 새 링크, 이전 링크는 무효).
      responses:
        '201':
          description: 새 링크
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/RoomInvite' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invites/preview:
    post:
      tags: [rooms]
      operationId: previewStudyRoomInvite
      summary: 초대 링크가 가리키는 방 미리보기
      security: [{}, { session: [] }]
      description: |
        로그인하지 않아도 된다. 토큰은 경로·쿼리가 아니라 본문으로만 받는다. 만료·무효·삭제된 방이면
        `404 RESOURCE_NOT_FOUND`(원인을 구분하지 않는다). 비로그인 응답에는 이름·맵·인원·비밀번호 방 여부만 있고,
        로그인했으면 `is_member`도 채운다. 같은 IP 기준 시간당 60회(`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteToken' }
      responses:
        '200':
          description: 미리보기
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data: { $ref: '#/components/schemas/InvitePreview' }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invites/accept:
    post:
      tags: [rooms]
      operationId: acceptStudyRoomInvite
      summary: 초대 링크로 참여
      description: |
        의미는 `joinStudyRoom`과 같다(비밀번호 방은 링크로도 `password`가 필요, `leave_current_room`
        규칙도 같다). 링크는 방을 찾아 줄 뿐이다. 만료·무효면 404. 참여와 같은 시간당 30회 제한을 쓴다.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
                password: { type: string, minLength: 4, maxLength: 20 }
                leave_current_room: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/RoomDetailOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RoomForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RoomConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: 태그 카탈로그·자동완성
      description: |
        `q`가 없으면 카탈로그 전체(`exam` 먼저, 그다음 이름 순). `q`가 있으면 서버가 정규화(앞뒤 공백·`#` 제거,
        대소문자 무시, NFC)한 뒤 정규 이름이나 별칭에 그 글자가 들어간 태그를 돌려준다. 별칭으로 맞아도 정규 태그
        하나로 나온다.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200': { $ref: '#/components/responses/TagsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/tags:
    get:
      tags: [tags]
      operationId: getMyTags
      summary: 내 태그(공개. 프로필에 보이고 추천에 쓴다)
      responses:
        '200': { $ref: '#/components/responses/TagsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [tags]
      operationId: putMyTags
      summary: 내 태그를 통째로 바꾼다
      description: '`tag_ids`는 카탈로그에 있는 태그, 서로 다르게 최대 5개. 응답은 바뀐 내 태그(카탈로그 순서).'
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tag_ids]
              properties:
                tag_ids: { type: array, maxItems: 5, uniqueItems: true, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/TagsOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /tag-suggestions:
    post:
      tags: [tags]
      operationId: suggestTag
      summary: 카탈로그에 없는 태그 제안
      description: |
        바로 태그가 되지 않는다. 운영자가 서버 CLI로 검토해 새 태그나 기존 태그의 별칭으로 넣는다. 같은 사람이 같은 이름을
        다시 보내면 한 건으로 둔다. 금칙어가 있으면 422 `name`. 사용자당 시간당 10회(`429`).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 20, description: 앞뒤 공백을 지운 뒤 1–20자 }
      responses:
        '201':
          description: 제안을 받았다
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, error, meta]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name: { type: string }
                  error: { type: 'null' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sv_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 클라이언트가 만든 UUID. 응답을 못 받으면 같은 키로 다시 보낸다.
      schema: { type: string, format: uuid }
    RoomId:
      name: room_id
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 안정적인 기계용 코드. 새 코드가 생길 수 있으니 닫힌 목록으로 다루지 않는다.
        message: { type: string }
        details: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, error, meta]
      properties:
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ErrorBody' }
        meta: { $ref: '#/components/schemas/Meta' }
    Session:
      type: object
      additionalProperties: false
      required: [user, csrf_token]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        csrf_token:
          type: string
          description: 상태 변경 요청의 `X-CSRF-Token`에 넣는다. 메모리에만 두고 저장하지 않는다.
    Me:
      type: object
      additionalProperties: false
      required: [id, profile, created_at, onboarding_completed_at]
      properties:
        id: { type: string, format: uuid }
        profile: { $ref: '#/components/schemas/Profile' }
        created_at: { type: string, format: date-time }
        onboarding_completed_at:
          description: |
            첫 가입 온보딩(캐릭터·이름·목표 태그 고르기 → 공부방 둘러보기)을 끝내거나 건너뛴 서버 시각. 아직이면
            null이고, 웹은 이때 온보딩을 보여 준다. 본인에게만 보인다(`Profile`에 넣지 않는다).
          type: [string, 'null']
          format: date-time
    Nickname:
      type: string
      description: |
        앞뒤 공백을 지운 뒤 1–12자(grapheme), UTF-8 48바이트 이하, 제어 문자 금지. 같은 닉네임을 여러 사람이 쓸 수 있다.
        금칙어(서버 목록, 공백·기호·대소문자를 무시하고 포함 검사)가 들어 있으면 쓸 수 없다. 서로 다른 여러 사람의
        신고가 기준(`REPORT_HIDE_THRESHOLD`, 기본 3)에 닿으면 서버가 무작위 닉네임으로 되돌린다.
    Avatar:
      type: object
      additionalProperties: false
      description: 조합 캐릭터. 값 목록의 순서는 계약이다(PocketTime Friends.Avatar와 같음).
      required: [shape, color, eyes, mouth, accessory]
      properties:
        shape: { type: string, enum: [circle, squircle, cloud, heart, flower, bow, star, triangle, burst, bubble, drop, arch] }
        color: { type: string, enum: [orange, tangerine, yellow, mint, blue, purple, pink, red, green, sky] }
        eyes: { type: string, enum: [googly, dot, happy, closed, wink, sparkle, sleepy, side] }
        mouth: { type: string, enum: [smile, grin, small, tongue, open, flat, kiss, smirk] }
        accessory: { type: string, enum: [none, blush, tuft, sprout, ribbon, crown, glasses, sunglasses] }
    Gender:
      type: string
      enum: [male, female]
      description: 3D 공부방 캐릭터 차림(머리·하의·신발).
    Profile:
      type: object
      additionalProperties: false
      required: [nickname, avatar, gender, tags]
      properties:
        nickname: { $ref: '#/components/schemas/Nickname' }
        avatar: { $ref: '#/components/schemas/Avatar' }
        tags:
          type: array
          maxItems: 5
          description: 내 태그(공개, 카탈로그 순서). 바꾸기는 `PUT /users/me/tags`로만 한다.
          items: { $ref: '#/components/schemas/Tag' }
        gender:
          description: 아직 고르지 않았으면 null. 온보딩을 보일지는 `Me.onboarding_completed_at`으로 정한다.
          oneOf:
            - { $ref: '#/components/schemas/Gender' }
            - { type: 'null' }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: { $ref: '#/components/schemas/Nickname' }
        avatar: { $ref: '#/components/schemas/Avatar' }
        gender:
          $ref: '#/components/schemas/Gender'
          description: 고른 뒤에는 지울 수 없고 다른 값으로만 바꾼다.
    ReportReason:
      type: string
      enum: [personal_info, defamation, profanity, sexual, impersonation, spam, other]
      description: |
        신고 사유(PocketTime 앱 `ReportReason`과 같은 값, 시간표용 `wrong_info` 제외). 앱 문구: 개인정보가 담겼어요 /
        누군가를 비방해요 / 욕설이 있어요 / 성적인 내용이에요 / 사칭해요 / 장난이거나 도배예요 / 그 밖의 문제예요.
        `other`는 `detail`이 필요하다.
    ChatBlock:
      type: object
      additionalProperties: false
      required: [user_id, nickname, avatar, blocked_at]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { $ref: '#/components/schemas/Nickname' }
        avatar: { $ref: '#/components/schemas/Avatar' }
        blocked_at: { type: string, format: date-time }
    ReportCreate:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason]
      properties:
        target_type:
          type: string
          enum: [nickname, room_name, message]
        target_id:
          type: string
          format: uuid
          description: 닉네임이면 그 사람의 사용자 id, 방 이름이면 방 id, 메시지면 메시지 id.
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail:
          type: [string, 'null']
          maxLength: 1000
          description: 무엇이 문제인지(앞뒤 공백을 지운 뒤 1000자 이하, 줄바꿈 외 제어 문자 금지). `reason`이 `other`면 필수.
    Report:
      type: object
      additionalProperties: false
      required: [target_type, target_id, reason, created_at]
      properties:
        target_type: { type: string, enum: [nickname, room_name, message] }
        target_id: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        created_at: { type: string, format: date-time }
    StudySettings:
      type: object
      additionalProperties: false
      required: [daily_goal_minutes, subjects, subject, subject_colors]
      properties:
        daily_goal_minutes:
          description: 하루 목표(분, 60의 배수 1–24시간). 없으면 null.
          type: [integer, 'null']
          minimum: 60
          maximum: 1440
          multipleOf: 60
        subjects:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 20 }
        subject: { type: [string, 'null'] }
        subject_colors:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 7 }
    Segment:
      type: object
      additionalProperties: false
      required: [started_at, ended_at]
      properties:
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time, description: 열린 구간이면 null(진행 중 세션의 마지막 구간만) }
    ActiveSession:
      type: object
      additionalProperties: false
      required: [id, subject, segments, timezone]
      properties:
        id: { type: string, format: uuid }
        subject: { type: [string, 'null'] }
        timezone: { type: string }
        segments: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Segment' } }
    StudyRecord:
      type: object
      additionalProperties: false
      required: [id, subject, started_at, ended_at, focused_seconds, study_date, segments]
      properties:
        id: { type: string, format: uuid }
        subject: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        focused_seconds: { type: integer, minimum: 1 }
        study_date: { type: string, format: date, description: 시작 시각의 공부일(04:00 경계) }
        segments: { type: array, items: { $ref: '#/components/schemas/Segment' } }
    DayTotal:
      type: object
      additionalProperties: false
      required: [date, seconds]
      properties:
        date: { type: string, format: date }
        seconds: { type: integer, minimum: 0 }
    LeagueStanding:
      type: object
      additionalProperties: false
      required: [league, week_start, week_end, status, group]
      properties:
        league:
          type: string
          enum: [general, top]
          description: 이 주의 내 리그(그룹이 있으면 그 그룹의 리그). 화면에는 `top`만 "카페인 리그"로 보인다(결정 L3).
        week_start: { type: string, format: date-time, description: 리그 주 시작(ISO, 월요일 04:00 KST) }
        week_end: { type: string, format: date-time, description: 리그 주 마감(ISO, 다음 월요일 04:00 KST) }
        status:
          type: string
          enum: [open, settling]
        group:
          description: 내 그룹. 이번 주 인정 시간이 아직 없으면 null.
          oneOf:
            - { $ref: '#/components/schemas/LeagueGroup' }
            - { type: 'null' }
    LeagueGroup:
      type: object
      additionalProperties: false
      required: [size, my_rank, gap_to_next_seconds, entries]
      properties:
        size: { type: integer, minimum: 1, maximum: 30, description: 이번 주 그룹 인원(탈퇴해도 줄지 않는다) }
        my_rank: { type: integer, minimum: 1 }
        gap_to_next_seconds:
          description: |
            바로 위 순위를 앞지르는 데 남은 초(점수 차 + 1. 같은 점수면 먼저 닿은 사람이 위라서 1초를 더 해야 올라간다). 1위면 null.
          type: [integer, 'null']
          minimum: 1
        entries:
          type: array
          maxItems: 30
          description: 순위 순서
          items: { $ref: '#/components/schemas/LeagueEntry' }
    LeagueEntry:
      type: object
      additionalProperties: false
      required: [id, rank, nickname, avatar, score_seconds, zone, is_me]
      properties:
        id: { type: string, description: 불투명 항목 id(HMAC). 사용자 id가 아니다. }
        rank: { type: integer, minimum: 1 }
        nickname: { $ref: '#/components/schemas/Nickname' }
        avatar: { $ref: '#/components/schemas/Avatar' }
        score_seconds: { type: integer, minimum: 0, description: 이번 주 인정 공부 시간(초) }
        zone:
          type: string
          enum: [promote, stay, relegate]
          description: 지금 순위로 주를 마치면 가는 곳(서버 판정)
        is_me: { type: boolean }
    StudyStreak:
      type: object
      additionalProperties: false
      required: [current, longest, today_seconds, today_remaining_seconds, recent_days]
      properties:
        current: { type: integer, minimum: 0 }
        longest: { type: integer, minimum: 0 }
        today_seconds: { type: integer, minimum: 0, description: 오늘 공부일의 인정 공부 시간(초) }
        today_remaining_seconds: { type: integer, minimum: 0, description: 오늘을 공부한 날로 치기까지 남은 초. 이미 채웠으면 0. }
        recent_days:
          type: array
          minItems: 7
          maxItems: 7
          description: 오늘을 포함한 최근 7일, 오래된 날부터
          items:
            type: object
            additionalProperties: false
            required: [date, state]
            properties:
              date: { type: string, format: date }
              state:
                type: string
                enum: [studied, missed, open]
                description: 공부한 날·놓친 날·아직 끝나지 않은 오늘(10분 미만)
    LeagueResult:
      type: object
      additionalProperties: false
      required: [week_start, week_end, league, outcome, next_league, rank, group_size, score_seconds]
      properties:
        week_start: { type: string, format: date-time, description: 정산한 리그 주 시작(ISO) }
        week_end: { type: string, format: date-time }
        league:
          type: string
          enum: [general, top]
          description: 그 주에 속했던 리그
        outcome:
          type: string
          enum: [promoted, stayed, relegated]
          description: 일반 → 카페인 리그 승급, 잔류, 카페인 리그 → 일반 강등
        next_league:
          type: string
          enum: [general, top]
          description: 다음 주 리그
        rank:
          description: 그룹 안 최종 순위. 그 주 그룹에 없었으면(공부 0, 카페인 리그 강등) null.
          type: [integer, 'null']
          minimum: 1
        group_size:
          description: 그 주 그룹 인원. 그룹에 없었으면 null.
          type: [integer, 'null']
          minimum: 1
          maximum: 30
        score_seconds: { type: integer, minimum: 0, description: 그 주 인정 공부 시간(초) }
    StudyStats:
      type: object
      additionalProperties: false
      required: [today, today_by_subject, yesterday_seconds, week, streak_days, subjects_week, recent_weeks]
      properties:
        today: { $ref: '#/components/schemas/DayTotal' }
        today_by_subject:
          type: array
          description: 오늘 공부일의 과목별 합계(미니 타이머 "오늘 n분"). 과목 없음은 subject null. 0초인 과목은 빠진다.
          items:
            type: object
            additionalProperties: false
            required: [subject, seconds]
            properties:
              subject: { type: [string, 'null'] }
              seconds: { type: integer, minimum: 1 }
        yesterday_seconds: { type: integer, minimum: 0 }
        week:
          type: object
          additionalProperties: false
          required: [days, total_seconds]
          properties:
            days: { type: array, minItems: 7, maxItems: 7, items: { $ref: '#/components/schemas/DayTotal' }, description: 월요일부터 }
            total_seconds: { type: integer, minimum: 0 }
        streak_days: { type: integer, minimum: 0, description: 인정 공부 시간 10분 이상인 날이 오늘(또는 어제)까지 이어진 수 }
        subjects_week:
          type: array
          description: 이번 주 과목별 합계, 많은 순. 1분 미만 제외. 과목 없음은 subject null.
          items:
            type: object
            additionalProperties: false
            required: [subject, seconds]
            properties:
              subject: { type: [string, 'null'] }
              seconds: { type: integer, minimum: 60 }
        recent_weeks:
          type: array
          description: 최근 16주(이번 주 포함) 하루 합계, 오래된 날부터. 16×7개.
          minItems: 112
          maxItems: 112
          items: { $ref: '#/components/schemas/DayTotal' }
    RoomMap:
      type: string
      enum: [cafe, library, rooftop]
      description: 3D 방 맵. cafe는 무료, library·rooftop은 상점에서 산다(지금은 카페 3D를 함께 씀). 모두 33석.
    RoomImage:
      type: object
      additionalProperties: false
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri, description: '미디어 저장소의 절대 공개 URL(운영은 `https://media.pocket-time.study/rooms/...`). 파일이 바뀌면 URL도 바뀌므로 오래 캐시해도 된다' }
    Room:
      type: object
      additionalProperties: false
      required: [id, name, description, has_password, capacity, map, member_count, studying_count, is_member, is_host, host_nickname, created_at, banner, logo, tags]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: [string, 'null'], maxLength: 100, description: 방장이 쓴 소개(줄바꿈 가능) }
        has_password: { type: boolean, description: 비밀번호가 있는 방(참여할 때 비밀번호가 필요) }
        capacity: { type: integer, minimum: 2, maximum: 50, description: 맵 자리 수(33)를 넘지 않는다 }
        map: { $ref: '#/components/schemas/RoomMap' }
        member_count: { type: integer, minimum: 1, maximum: 50 }
        studying_count: { type: integer, minimum: 0, description: 지금 공부 중인 멤버 수(서버 presence 기준) }
        is_member: { type: boolean }
        is_host: { type: boolean }
        host_nickname: { $ref: '#/components/schemas/Nickname' }
        created_at: { type: string, format: date-time }
        banner:
          oneOf:
            - { $ref: '#/components/schemas/RoomImage' }
            - { type: 'null' }
        logo:
          oneOf:
            - { $ref: '#/components/schemas/RoomImage' }
            - { type: 'null' }
        tags: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/Tag' }, description: 방장이 고른 태그(카탈로그 순서) }
    RoomPassword:
      type: string
      pattern: '^[A-Za-z0-9]{4,20}$'
      description: 비밀번호 방의 비밀번호. 영문·숫자 4–20자, 대소문자 구분(PocketTime과 같다).
    RoomCreate:
      type: object
      additionalProperties: false
      required: [name, map, capacity, tag_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: 앞뒤 공백을 지운 뒤 1–40자 }
        description: { type: [string, 'null'], maxLength: 100, description: 앞뒤 공백을 지운다. 비면 없음 }
        map: { $ref: '#/components/schemas/RoomMap' }
        capacity: { type: integer, minimum: 2, maximum: 50 }
        password:
          description: 있으면 비밀번호 방. 없거나 null이면 누구나 참여.
          oneOf:
            - { $ref: '#/components/schemas/RoomPassword' }
            - { type: 'null' }
        tag_ids: { type: array, maxItems: 3, uniqueItems: true, items: { type: string }, description: 카탈로그 태그, 최대 3개 }
    RoomUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: [string, 'null'], maxLength: 100 }
        map: { $ref: '#/components/schemas/RoomMap' }
        capacity: { type: integer, minimum: 2, maximum: 50 }
        password:
          oneOf:
            - { $ref: '#/components/schemas/RoomPassword' }
            - { type: 'null' }
        tag_ids: { type: array, maxItems: 3, uniqueItems: true, items: { type: string } }
    RoomMember:
      type: object
      additionalProperties: false
      required: [user_id, nickname, avatar, is_host, tags]
      properties:
        user_id: { type: string }
        nickname: { $ref: '#/components/schemas/Nickname' }
        avatar: { $ref: '#/components/schemas/Avatar' }
        is_host: { type: boolean }
        tags: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Tag' }, description: 그 사람의 공개 태그 }
    RoomDetail:
      type: object
      additionalProperties: false
      required: [room, members, password]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        members:
          description: 멤버면 전체 명단(방장 먼저, 들어온 순). 멤버가 아니면 null.
          oneOf:
            - { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RoomMember' } }
            - { type: 'null' }
        password:
          description: |
            비밀번호 방의 방장에게만 온다. 그 밖에는 null. 서버는 같은 `Idempotency-Key` 재전송에 돌려줄 기록에 비밀번호를
            남기지 않으므로, 재전송으로 받은 응답(`Idempotent-Replayed: true`)에서는 null이다(`GET`으로 다시 읽는다).
          oneOf:
            - { $ref: '#/components/schemas/RoomPassword' }
            - { type: 'null' }
    RoomInvite:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri, description: '`https://<웹>/r#<token>`' }
        expires_at: { type: string, format: date-time }
    InviteToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 16, maxLength: 128 }
    InvitePreview:
      type: object
      additionalProperties: false
      required: [room_id, name, map, member_count, capacity, has_password, is_member]
      properties:
        room_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        map: { $ref: '#/components/schemas/RoomMap' }
        member_count: { type: integer, minimum: 1, maximum: 50 }
        capacity: { type: integer, minimum: 2, maximum: 50 }
        has_password: { type: boolean }
        is_member: { type: boolean, description: 로그인했고 이미 이 방 멤버면 true. 비로그인은 false }
    Tag:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [exam, kind], description: exam은 시험·목표, kind는 공부 종류 }
        name: { type: string, minLength: 1, maxLength: 20, description: 정규 이름(별칭이 아니다) }
  responses:
    RoomDetailOk:
      description: 공부방 상세
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data: { $ref: '#/components/schemas/RoomDetail' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    RoomForbidden:
      description: |
        `STUDY_ROOM_HOST_ONLY`(방장만 할 수 있음), `STUDY_ROOM_WRONG_PASSWORD`(비밀번호가 틀림),
        `STUDY_ROOM_MAP_NOT_OWNED`(안 산 유료 맵), `ROOM_CREATE_RESTRICTED`(운영자가 이 계정·IP의 방 만들기를 정지),
        `STUDY_ROOM_NOT_MEMBER`(멤버만 할 수 있음: 자리 옮기기), `CSRF_REJECTED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RoomConflict:
      description: |
        `STUDY_ROOM_FULL`(정원 참), `STUDY_ROOM_ALREADY_MEMBER`(다른 방 멤버, `details.room_id`·`details.is_host`),
        `STUDY_ROOM_CAPACITY_BELOW_MEMBERS`(정원을 멤버 수 아래로), `STUDY_ROOM_SEAT_TAKEN`(다른 사람이 앉은 자리),
        `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TagsOk:
      description: 태그 목록
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [tags]
                properties:
                  tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    LoggedIn:
      description: 로그인 성공. `sv_session` 쿠키를 둔다. 새 계정이면 닉네임·캐릭터를 무작위로 정한다(PocketTime과 같은 규칙).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data: { $ref: '#/components/schemas/Session' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    MeOk:
      description: 내 계정
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data: { $ref: '#/components/schemas/Me' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    ProfileOk:
      description: 프로필
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [profile]
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    StudySettingsOk:
      description: 설정
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data: { $ref: '#/components/schemas/StudySettings' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    ActiveSessionOk:
      description: 진행 중 세션
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session:
                    oneOf:
                      - { $ref: '#/components/schemas/ActiveSession' }
                      - { type: 'null' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    Conflict:
      description: 상태 충돌(`SESSION_NOT_ACTIVE` 등).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 세션 없음·만료·폐기(`UNAUTHORIZED`). 원인을 구분하지 않는다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCredentials:
      description: 제공자 토큰 검증 실패(`INVALID_CREDENTIALS`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CsrfRejected:
      description: CSRF 토큰이 없거나 틀림, 또는 허용하지 않은 Origin(`CSRF_REJECTED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: DB 등 필수 의존성에 닿지 않음(`SERVICE_UNAVAILABLE`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyKeyRequired:
      description: 키가 필요한 쓰기에서 `Idempotency-Key`가 없거나 UUID가 아님(`IDEMPOTENCY_KEY_REQUIRED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: 요청 본문이 64KB를 넘음(`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccountRateLimited:
      description: 이 IP에서 새 계정을 너무 많이 만듦(`ACCOUNT_RATE_LIMITED`). `Retry-After` 헤더.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BlocksOk:
      description: 내 차단 목록
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [blocks]
                properties:
                  blocks: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ChatBlock' } }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    BlockOk:
      description: 차단함(처음이든 반복이든 같은 모양)
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [block]
                properties:
                  block: { $ref: '#/components/schemas/ChatBlock' }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    SeatOk:
      description: 옮긴(또는 이미 앉아 있던) 자리
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, error, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [seat]
