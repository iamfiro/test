                  seat: { type: integer, minimum: 0, maximum: 32 }
              error: { type: 'null' }
              meta: { $ref: '#/components/schemas/Meta' }
    ReportOk:
      description: 신고를 받음(처음이든 같은 신고의 반복이든 같은 모양).
      content:
        application/json:
          schema:
            type: object
