# 로컬 개발·테스트용 Postgres. 서버는 `npm run dev`로 따로 띄운다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: studyvillage
      POSTGRES_PASSWORD: studyvillage
      POSTGRES_DB: studyvillage
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvillage"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
